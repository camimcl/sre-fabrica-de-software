services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loadforge_s09_demo
      POSTGRES_USER: loadforge
      POSTGRES_PASSWORD: ${QA_DATABASE_PASSWORD:?Required by the QA launcher}
    ports: ["127.0.0.1:55439:5432"]
    volumes: ["qa_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadforge -d loadforge_s09_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: ../../backend
    environment:
      POSTGRES_DB: loadforge_s09_demo
      POSTGRES_USER: loadforge
      POSTGRES_PASSWORD: ${QA_DATABASE_PASSWORD:?Required by the QA launcher}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      LOADFORGE_TOKEN_SECRET: ${QA_TOKEN_SECRET:?Required by the QA launcher}
      LOADFORGE_MODEL_DIR: /models
      LOADFORGE_MANAGED_RUNTIME: "1"
    stop_grace_period: 75s
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["127.0.0.1:58109:8000"]
    volumes: ["qa_models:/models"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 2s
      timeout: 3s
      retries: 30
  frontend:
    build: ../../frontend
    ports: ["127.0.0.1:5189:80"]
    depends_on:
      api: {condition: service_healthy}
  target:
    image: python:3.11-slim
    command: ["python", "/target.py"]
    volumes: ["./target.py:/target.py:ro"]
volumes:
  qa_db:
  qa_models:
