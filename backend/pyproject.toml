[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "loadforge-backend"
version = "0.7.0"
description = "API do LoadForge com consulta, analise, auditoria e exportacao"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "reportlab>=4.0,<5",
  "joblib>=1.4,<2",
  "psycopg[binary]>=3.2,<4",
  # numpy/scipy pinned to ranges ABI-compatible with scikit-learn 1.5.x.
  # scikit-learn 1.5 wheels are built against the numpy 1.x ABI, so numpy must
  # stay below 2.0; scipy is pinned to a version that still supports numpy 1.x.
  "numpy>=1.26,<2",
  "scipy>=1.11,<1.14",
  "scikit-learn>=1.5,<1.6",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
python_classes = ["*Test"]
markers = ["integration: requires a migrated PostgreSQL test database"]
