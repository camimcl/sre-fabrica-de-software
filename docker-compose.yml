services:
  db:
    image: postgres:16-alpine
    container_name: loadforge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loadforge}
      POSTGRES_USER: ${POSTGRES_USER:-loadforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - loadforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loadforge} -d ${POSTGRES_DB:-loadforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ./backend
    container_name: loadforge-migrate
    profiles: ["tools"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loadforge}
      POSTGRES_USER: ${POSTGRES_USER:-loadforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: ./backend
    container_name: loadforge-api
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loadforge}
      POSTGRES_USER: ${POSTGRES_USER:-loadforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      LOADFORGE_TOKEN_SECRET: ${LOADFORGE_TOKEN_SECRET:?Defina LOADFORGE_TOKEN_SECRET no arquivo .env}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    container_name: loadforge-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  loadforge_pgdata:
    name: loadforge_pgdata
